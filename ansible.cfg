[defaults]
retry_files_enabled = False
host_key_checking = False
interpreter_python = /usr/bin/python3
forks = 10

# Output quality: follow along live, diagnose failures
# hide no-op "skipping:" noise
display_skipped_hosts = False
# show stderr of failed commands, not just the summary
display_failed_stderr = True
# per-task timing summary at end of play (profile_tasks)
show_custom_stats = True
# print a line when each host starts each task
show_per_host_start = True
# show file diffs for changed copy/template tasks
diff_always = True
# task durations + slowest-task recap
callbacks_enabled = ansible.posix.profile_tasks
# full run log for after-the-fact diagnosis
log_path = ansible.log
