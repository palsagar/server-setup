---
- name: Install baseline packages
  apt:
    name:
      - git
      - curl
      - wget
      - unzip
      - tar
      - build-essential
      - zsh
      - tmux
      - btop
      - fd-find
      - bat
      - dnsutils
      - locales
      - sudo
      - ca-certificates
      - gnupg
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Symlink fd (Debian/Ubuntu renames it fdfind)
  file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link

- name: Symlink bat (Debian/Ubuntu renames it batcat)
  file:
    src: /usr/bin/batcat
    dest: /usr/local/bin/bat
    state: link

- name: Enable en_US.UTF-8 locale
  lineinfile:
    path: /etc/locale.gen
    regexp: '^# ?en_US.UTF-8'
    line: 'en_US.UTF-8 UTF-8'
  notify: Generate locales
