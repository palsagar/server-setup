---
- hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: All tools on PATH via interactive zsh (proves .zshrc loads clean)
      command: zsh -ic 'command -v fzf eza fd bat zoxide yazi lazygit btop tmux uv thefuck ipdb nvim docker'
      changed_when: false
      failed_when: path_check.rc != 0
      register: path_check

    - name: docker compose works
      command: docker compose version
      changed_when: false

    - name: docker buildx works
      command: docker buildx version
      changed_when: false

    - name: nvim starts headless
      command: nvim --headless '+quit'
      changed_when: false

    - name: lazy.nvim installed (Lazy sync ran)
      stat:
        path: /root/.local/share/nvim/lazy/lazy.nvim
      register: lazy_nvim
      failed_when: not lazy_nvim.stat.exists

    - name: Dotfiles and clones present
      stat:
        path: "{{ item }}"
      loop:
        - /root/.zshrc
        - /root/.p10k.zsh
        - /root/.tmux.conf
        - /root/.oh-my-zsh/oh-my-zsh.sh
        - /root/.oh-my-zsh/custom/themes/powerlevel10k
        - /root/.oh-my-zsh/custom/plugins/zsh-autosuggestions
        - /root/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting
        - /root/.tmux/plugins/tpm
        - /root/.tmux/plugins/vim-tmux-navigator
        - /root/.tmux/plugins/tmux-resurrect
        - /root/.tmux/plugins/tmux-continuum
        - /root/.tmux/plugins/tmux-yank
      register: dotfiles
      failed_when: not dotfiles.stat.exists
      loop_control:
        label: "{{ item }}"

    - name: User shell is zsh
      command: getent passwd root
      register: passwd_entry
      changed_when: false
      failed_when: "'/usr/bin/zsh' not in passwd_entry.stdout"

    - name: No sagar account exists
      command: getent passwd sagar
      register: sagar_check
      changed_when: false
      failed_when: sagar_check.rc == 0

    - name: No macOS-only content in deployed .zshrc
      shell: "grep -cE 'LM Studio|\\.bun|OPENROUTER|claude-mem|homebrew' /root/.zshrc || true"
      register: forbidden
      changed_when: false
      failed_when: forbidden.stdout != '0'

    - name: .zshrc sources .zshrc.local as final line
      command: tail -n1 /root/.zshrc
      register: zshrc_last
      changed_when: false
      failed_when: "'source ~/.zshrc.local' not in zshrc_last.stdout"
